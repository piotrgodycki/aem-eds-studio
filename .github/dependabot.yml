# Weekly dependency updates, grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Types follow the oldest Node the app runs on (Electron 45 is Node 24,
      # the CLI supports 20+); newer ones would type APIs it doesn't have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
