name: Desktop
run-name: ${{ inputs.version && format('Release v{0}', inputs.version) || (startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name)) || format('Desktop build · {0}', github.event.pull_request.title || github.ref_name) }}
# Builds the desktop app on real macOS and Windows runners and starts each
# packaged app in smoke mode (server up, bundled eds runs a real command).
# To release: Actions → Desktop → Run workflow on main with the version (as in
# package.json), or push a v* tag. Either way the installers and the updater
# files go to a draft GitHub release; publishing it is what installed apps
# update to (and, for a run from Actions, creates the tag).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (as in package.json, e.g. 0.3.0). Leave empty to only build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Which release this run makes, if any, after checking it can.
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then want="${INPUT#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then want="${GITHUB_REF_NAME#v}"
          else echo "Not a release: build only."; exit 0; fi
          have=$(node -p "require('./package.json').version")
          if [ "$have" != "$want" ]; then
            echo "::error title=Version mismatch::package.json on ${GITHUB_REF_NAME} is $have, asked to release $want. Bump it in a PR first (docs/releases.md)."
            exit 1
          fi
          if gh release view "v$want" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Already released::v$want exists (maybe as a draft). Delete it or release a new version."
            exit 1
          fi
          echo "::notice title=Releasing::AEM EDS Studio v$want from ${GITHUB_SHA::7}"
          echo "tag=v$want" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            app: release/mac-arm64/AEM EDS Studio.app/Contents/MacOS/AEM EDS Studio
          - os: windows-latest
            platform: win
            app: release/win-unpacked/AEM EDS Studio.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Package
        shell: bash
        env:
          # Signing turns on when these secrets exist; otherwise macOS builds
          # are ad-hoc signed and Windows builds are unsigned.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--${{ matrix.platform }} --publish never)
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            [ "${{ matrix.platform }}" = mac ] && args+=(-c.mac.identity=-)
          else
            # A signed macOS build can replace itself (Squirrel.Mac); the app reads this flag.
            [ "${{ matrix.platform }}" = mac ] && args+=(-c.extraMetadata.studioSigned=true)
            if [ "${{ matrix.platform }}" = mac ] && [ -n "$APPLE_ID" ]; then
              args+=(-c.mac.notarize=true)
            fi
          fi
          npx electron-builder "${args[@]}"

      - name: Smoke test the packaged app
        shell: bash
        run: |
          export STUDIO_SMOKE="$RUNNER_TEMP/smoke.json"
          export AEM_EDS_STUDIO_HOME="$RUNNER_TEMP/studio-home"
          "${{ matrix.app }}" || true
          cat "$STUDIO_SMOKE"
          node -e 'const r=require(process.env.STUDIO_SMOKE); if(!r.ok){console.error("smoke test failed");process.exit(1)}'

      - uses: actions/upload-artifact@v4
        with:
          name: aem-eds-studio-${{ matrix.platform }}
          # The installers, plus what the in-app updater reads: latest*.yml,
          # the macOS .zip and the blockmaps for partial downloads.
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    if: needs.check.outputs.tag != ''
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft the release with the installers and the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          {
            echo
            echo "**Download:** macOS \`.dmg\` (Apple Silicon or Intel) or Windows \`.exe\` below. Installed apps from 0.3.0 on update themselves once this release is published."
          } >> notes.md
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "AEM EDS Studio $TAG" --notes-file notes.md
          echo "Draft: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
